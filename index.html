<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sos el Impulso</title>
<meta name="description" content="Juego sobre El Sistema Nervioso: Simpáticos contra Parasimpáticos.">

<style>
@font-face {
  font-family: 'Homemade Apple';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(fonts/HomemadeApple-400.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Kalam';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(fonts/Kalam-400.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Kalam';
  font-style: normal;
  font-weight: 700;
  font-display: swap;
  src: url(fonts/Kalam-700.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
@font-face {
  font-family: 'Permanent Marker';
  font-style: normal;
  font-weight: 400;
  font-display: swap;
  src: url(fonts/PermanentMarker-400.woff2) format('woff2');
  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
}
body{margin:0}
</style>
</head>
<body>
<style>
/* Layout: hoja de carpeta cuadriculada; izquierda el dibujo de palitos con el recorrido, derecha la nota de cada parada; arriba el tanteador con palitos de conteo. Rojo = Simpáticos, azul = Parasimpáticos */
:root{
  --paper:#f9fbfd;
  --grid:#d3e3f1;
  --margin:#e79a9a;
  --ink:#1f3d91;      /* birome azul: Parasimpáticos */
  --red:#c9302a;      /* birome roja: Simpáticos */
  --pencil:#3a3e46;
  --hl:#fff27a;       /* resaltador amarillo */
  --hl2:#b8f0c8;      /* resaltador verde */
  --gold:#e0a106;
  --ok:#2b7a4b;
  --note:#ffffff;
  --tape:rgba(236,214,140,.62);
  --f-marker:'Permanent Marker','Comic Sans MS','Chalkboard SE',cursive;
  --f-hand:'Kalam','Comic Sans MS','Chalkboard SE',cursive;
  --f-sign:'Homemade Apple','Brush Script MT',cursive;
  color-scheme:light;
}
html,body{height:100%}
[hidden]{display:none!important}
body{
  background-color:var(--paper);
  background-image:
    linear-gradient(90deg,transparent 46px,var(--margin) 46px,var(--margin) 48px,transparent 48px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:100% 100%,26px 26px,26px 26px;
  color:var(--pencil);
  font-family:var(--f-hand);
  font-size:clamp(16px,1.25vw,22px);
  overflow-x:hidden;
}
.app{
  position:relative;z-index:1;
  min-height:100%;box-sizing:border-box;
  display:flex;flex-direction:column;gap:8px;
  padding-block:10px 16px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
}
.inner{padding-left:clamp(40px,4vw,64px);display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px}
.brand{font-family:var(--f-marker);color:var(--pencil);font-size:1.2rem;transform:rotate(-1.5deg);justify-self:start}
.brand b{color:var(--red);font-weight:400}
.tools{display:flex;gap:14px;justify-self:end}
.tool{
  font:inherit;font-size:.9rem;color:var(--pencil);background:none;border:0;cursor:pointer;
  padding:2px 4px;text-decoration:underline wavy rgba(58,62,70,.45);text-underline-offset:4px;
}
.tool:focus-visible,.opt:focus-visible,.go:focus-visible,.pick:focus-visible{outline:3px dashed var(--pencil);outline-offset:4px}

/* tanteador */
.score{display:flex;align-items:center;gap:16px;font-weight:700;font-size:clamp(1rem,1.3vw,1.35rem)}
.score[hidden]{display:none!important}
.team{display:flex;align-items:center;gap:8px;padding:3px 12px;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;transition:background .3s,transform .3s}
.team.turn{background:var(--hl);transform:scale(1.08) rotate(-1deg)}
.team .nm{white-space:nowrap;font-family:var(--f-marker);font-weight:400}
.team .num{font-family:var(--f-marker);font-weight:400;font-size:1.3em;min-width:1ch;text-align:center}
.tally{height:28px;width:auto;overflow:visible}
.tally line{stroke-width:2.8;stroke-linecap:round}
.team.L{color:var(--red)}
.team.R{color:var(--ink)}
.team.L .tally line{stroke:var(--red)}
.team.R .tally line{stroke:var(--ink)}
.team.bump{animation:bump .6s cubic-bezier(.3,1.8,.5,1)}
@keyframes bump{40%{transform:scale(1.35) rotate(-3deg)}}
.vs{font-family:var(--f-marker);color:#9aa0aa}

/* banda del equipo que responde */
#edge{position:fixed;top:0;bottom:0;width:min(120px,9vw);pointer-events:none;z-index:2;opacity:0;transition:opacity .4s}
#edge.L{left:0;opacity:1;background:linear-gradient(90deg,rgba(201,48,42,.30),transparent)}
#edge.R{right:0;opacity:1;background:linear-gradient(270deg,rgba(31,61,145,.30),transparent)}

.stage{flex:1;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.3fr);gap:clamp(12px,3vw,48px);align-items:center;min-height:0}
.map{min-width:0;display:flex;justify-content:center}
.map svg{width:100%;max-width:440px;height:auto;max-height:calc(100vh - 100px);overflow:visible}
.map.shake,.note.shake{animation:shake .45s}

.note{
  position:relative;min-width:0;
  background:var(--note);
  padding:clamp(22px,2.4vw,40px) clamp(20px,2.8vw,46px);
  box-shadow:3px 4px 0 rgba(31,61,145,.10),0 1px 2px rgba(0,0,0,.08);
  transform:rotate(-.7deg);
  display:flex;flex-direction:column;gap:clamp(9px,1.1vw,15px);
}
.note::before,.note::after{content:"";position:absolute;width:96px;height:26px;background:var(--tape);top:-12px}
.note::before{left:22px;transform:rotate(-6deg)}
.note::after{right:26px;transform:rotate(5deg)}
.note.gold{box-shadow:0 0 0 4px var(--gold),3px 6px 0 rgba(224,161,6,.35)}
.note.enter{animation:enter .45s cubic-bezier(.2,.9,.3,1.2)}
@keyframes enter{from{transform:rotate(3deg) translateY(30px) scale(.96);opacity:0}}
@keyframes shake{0%,100%{translate:0 0}20%{translate:-12px 2px}40%{translate:10px -2px}60%{translate:-7px 1px}80%{translate:4px 0}}

.eyebrow{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.95rem;letter-spacing:.06em;text-transform:uppercase;color:var(--pencil);font-weight:700}
.eyebrow .gold{color:var(--gold);font-family:var(--f-marker);letter-spacing:.02em;font-weight:400;font-size:1.15em}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:12px;height:12px;border:2px solid var(--pencil);border-radius:50% 45% 55% 50%;display:block}
.dots i.done{background:var(--pencil)}
.dots i.now{background:var(--hl)}
.dots i.g{border-color:var(--gold)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.turnbox{font-family:var(--f-marker);font-size:clamp(1.2rem,2vw,2rem);line-height:1.1}
.turnbox.L{color:var(--red)}
.turnbox.R{color:var(--ink);margin-left:auto}
.turnbox.flip{animation:pop .5s cubic-bezier(.3,1.8,.5,1)}
.reader{font-size:.95rem;color:#6b7079}
.reader b{color:var(--pencil)}
.scene{font-size:clamp(1.1rem,1.5vw,1.55rem);line-height:1.35;margin:0;max-width:34em;text-wrap:pretty}
.ask{font-weight:700;color:var(--pencil);font-size:clamp(1.3rem,2.05vw,2.15rem);line-height:1.2;margin:0;text-wrap:balance}
.hl{background:linear-gradient(100deg,transparent 2%,var(--hl) 4%,var(--hl) 94%,transparent 97%);padding:0 .15em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
.big{font-family:var(--f-marker);font-weight:400}

/* mecha */
.fuse{display:flex;align-items:center;gap:12px;height:26px}
.fuse .track{position:relative;flex:1;height:26px}
.fuse .rope{position:absolute;left:0;top:11px;height:4px;width:100%;transform-origin:left;
  background:repeating-linear-gradient(90deg,var(--pencil) 0 7px,transparent 7px 10px)}
.fuse .fire{position:absolute;top:3px;width:20px;height:20px;margin-left:-10px;border-radius:50%;
  background:radial-gradient(circle,#fff 0 20%,var(--hl) 35%,#ffb020 60%,transparent 72%);animation:flick .12s infinite alternate}
@keyframes flick{to{transform:scale(1.25) rotate(20deg)}}
.fuse .sec{font-family:var(--f-marker);font-size:1.4rem;min-width:2.2ch;text-align:right;font-variant-numeric:tabular-nums}
.fuse.low .sec{color:var(--red);animation:pulse .5s infinite}
.fuse.paused .fire{animation:none;opacity:.5}

.opts{display:flex;flex-wrap:wrap;gap:clamp(10px,1.3vw,18px)}
.opts[hidden]{display:none!important}
.reveal{font-family:var(--f-marker);font-size:clamp(1.2rem,1.9vw,1.9rem);color:var(--pencil);background:var(--hl);border:3px solid var(--pencil);border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:.3em 1em;cursor:pointer;align-self:flex-start;animation:wiggle 1.6s infinite}
@keyframes wiggle{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1.5deg) scale(1.03)}}
.opt{
  font-family:var(--f-hand);font-weight:700;font-size:clamp(1.15rem,1.85vw,1.9rem);
  color:var(--pencil);background:rgba(255,255,255,.9);
  border:3px solid var(--pencil);
  border-radius:255px 15px 225px 15px/15px 225px 15px 255px;
  padding:.3em .95em .3em .55em;cursor:pointer;
  display:flex;align-items:center;gap:.5em;
  transition:transform .15s,background .2s;
  animation:dealIn .4s cubic-bezier(.2,.9,.3,1.3) both;
}
.opt:nth-child(2){border-radius:15px 225px 15px 255px/255px 15px 225px 15px;animation-delay:.12s}
.opt:nth-child(3){animation-delay:.24s}
@keyframes dealIn{from{transform:translateY(20px) rotate(-6deg);opacity:0}}
.opt:hover:not(:disabled){transform:rotate(-1.2deg) scale(1.04);background:#fffbe0}
.opt .k{font-size:.6em;width:1.6em;height:1.6em;display:grid;place-items:center;border:2px solid currentColor;border-radius:50%;opacity:.7}
.opt.pending{background:var(--hl);border-style:dashed;animation:suspense .25s infinite alternate}
@keyframes suspense{to{transform:scale(1.06) rotate(1deg)}}
.opt.wrong{color:#8a8d94;border-color:#b9bcc2;text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:4px;cursor:default;animation:none}
.opt.right{border-color:var(--ok);color:var(--ok);background:var(--hl2);animation:none;transform:scale(1.05) rotate(-1deg)}
.opt:disabled{cursor:default}

.fb{font-size:clamp(1.02rem,1.4vw,1.45rem);line-height:1.35;max-width:36em;display:flex;flex-direction:column;gap:.35em}
.fb:empty{display:none}
.fb .tag{font-family:var(--f-marker);display:block;font-size:1.35em;transform:rotate(-1.5deg);transform-origin:left;animation:pop .45s cubic-bezier(.3,1.8,.5,1) both}
.fb.bad{color:var(--red)}
.fb.good{color:var(--ok)}
.fb .tag svg{vertical-align:-.15em;margin-right:.2em}
.fb .pts{font-family:var(--f-marker);font-size:1.05em}
.shout{font-family:var(--f-marker);color:var(--red);font-size:clamp(2.2rem,5vw,4.6rem);line-height:1;transform:rotate(-3deg);transform-origin:left;animation:pop .5s cubic-bezier(.3,1.8,.5,1) both}
@keyframes pop{from{transform:rotate(-3deg) scale(.3);opacity:0}}

/* relator */
.relator{position:relative;align-self:flex-start;max-width:30em;background:#fffdf0;border:2.5px solid var(--pencil);border-radius:18px 24px 20px 14px;padding:.4em .9em;font-weight:700;font-size:clamp(1rem,1.35vw,1.35rem);animation:pop .45s cubic-bezier(.3,1.8,.5,1) both;margin:0}
.relator::before{content:"RELATOR";position:absolute;top:-.85em;left:12px;background:var(--note);padding:0 6px;font-size:.6em;letter-spacing:.1em;color:#6b7079}
.relator[hidden]{display:none!important}

.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.go{
  font-family:var(--f-marker);font-size:clamp(1.2rem,1.9vw,1.9rem);color:var(--pencil);
  background:none;border:0;cursor:pointer;padding:.1em .2em;
  text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:6px;
}
.go:hover{color:var(--red)}
.hint{font-size:.85rem;color:#6b7079}

/* respiración */
.breath{display:flex;align-items:center;gap:18px;color:var(--ink)}
.ball{width:84px;height:84px;border:3px solid var(--ink);border-radius:52% 48% 50% 50%;background:var(--hl2);transform:scale(.35);animation:breathe 7s ease-in-out forwards}
@keyframes breathe{0%{transform:scale(.35)}50%{transform:scale(1)}100%{transform:scale(.35)}}
.breath span{font-family:var(--f-marker);font-size:clamp(1.3rem,2.2vw,2.2rem)}

/* intro, equipos */
.title{font-family:var(--f-marker);color:var(--pencil);font-size:clamp(2.8rem,6.4vw,6rem);line-height:1.1;margin:0 0 .35em;transform:rotate(-2deg);text-wrap:balance}
.title .hl{padding:0 .08em;color:var(--red);background:linear-gradient(176deg,transparent 30%,var(--hl) 30%,var(--hl) 86%,transparent 86%)}
.title .bolt{display:inline-block;width:.55em;vertical-align:-.05em;animation:zap 1.4s infinite}
@keyframes zap{0%,86%,100%{transform:none;opacity:1}88%{transform:scale(1.3) rotate(10deg);opacity:.3}92%{transform:scale(1.15)}}
.how{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:.3em;font-size:clamp(1.02rem,1.35vw,1.4rem)}
.how li::marker{color:var(--red)}
.credits{font-size:.95rem;color:#5b6070;border-top:2px dashed var(--grid);padding-top:10px;margin:0}
.versus{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px}
.side{padding:14px 12px;border:3px solid currentColor;display:flex;flex-direction:column;gap:6px;animation:slideL .6s cubic-bezier(.2,.9,.3,1.2) both}
.side.L{color:var(--red);border-radius:14px 30px 12px 26px;transform:rotate(-1.5deg);background:rgba(201,48,42,.06)}
.side.R{color:var(--ink);border-radius:30px 14px 26px 12px;transform:rotate(1.5deg);text-align:right;background:rgba(31,61,145,.06);animation-name:slideR}
@keyframes slideL{from{translate:-60px 0;opacity:0}}
@keyframes slideR{from{translate:60px 0;opacity:0}}
.side .big{font-size:clamp(1.4rem,2.6vw,2.6rem);line-height:1}
.side .cry{font-family:var(--f-marker);font-size:clamp(1rem,1.5vw,1.5rem);background:var(--hl);color:var(--pencil);padding:0 .3em;align-self:flex-start}
.side.R .cry{align-self:flex-end}
.side small{color:var(--pencil);font-size:.9rem}
.vsbig{font-family:var(--f-marker);font-size:clamp(2rem,4vw,4rem);color:var(--pencil);transform:rotate(-8deg);animation:pop .5s .5s cubic-bezier(.3,1.8,.5,1) both}
.picks{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.pick{font-family:var(--f-marker);font-size:clamp(1rem,1.5vw,1.5rem);background:#fff;border:3px solid currentColor;border-radius:255px 15px 225px 15px/15px 225px 15px 255px;padding:.2em .8em;cursor:pointer}
.pick.L{color:var(--red)}
.pick.R{color:var(--ink)}
.pick.N{color:#6b7079}
.pick:hover{background:var(--hl)}

/* duelo */
.keys{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.key{border:3px solid currentColor;border-radius:14px 26px 12px 22px;padding:10px;text-align:center;display:flex;flex-direction:column;gap:2px}
.key.L{color:var(--red)}
.key.R{color:var(--ink)}
.key kbd{font-family:var(--f-marker);font-size:clamp(2.2rem,5vw,4.4rem);line-height:1}
.clock{font-family:var(--f-marker);font-size:clamp(3rem,8vw,7rem);line-height:1;font-variant-numeric:tabular-nums;margin:0}
.wait{font-family:var(--f-marker);font-size:clamp(2rem,5vw,4.5rem);color:var(--red);margin:0;animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.35}}
.chain{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;align-items:center;gap:.3em .55em;font-size:clamp(1rem,1.45vw,1.5rem);font-weight:700}
.chain li{opacity:0;transform:translateY(6px);transition:opacity .35s,transform .35s}
.chain li.on{opacity:1;transform:none}
.chain .af{color:var(--ink)}
.chain .ef{color:var(--red)}
.chain .ar{color:#8a8d94}

.flash{position:fixed;inset:0;background:var(--paper);display:grid;place-items:center;align-content:center;gap:10px;z-index:30;padding:20px}
.flash[hidden]{display:none!important}
.flash.real{background:var(--hl)}
.flash svg{width:min(46vw,400px);max-height:62vh;height:auto}
.flash p{font-family:var(--f-marker);font-size:clamp(1.6rem,4vw,3.4rem);color:var(--red);margin:0;text-align:center}
.flash .word{font-family:var(--f-marker);font-size:clamp(5rem,16vw,14rem);color:var(--pencil);line-height:1;transform:rotate(-4deg)}
.flash .halves{position:absolute;inset:auto 0 18px 0;display:flex;justify-content:space-between;padding:0 24px;font-family:var(--f-marker);font-size:clamp(1rem,2vw,1.6rem)}

/* campeones */
.champ{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.champ svg.crown{width:clamp(80px,10vw,140px);height:auto;animation:pop .6s cubic-bezier(.3,1.8,.5,1) both}
.champ .who{font-family:var(--f-marker);font-size:clamp(2.6rem,6.5vw,6rem);line-height:.95;margin:0;transform:rotate(-2deg);animation:pop .6s .2s cubic-bezier(.3,1.8,.5,1) both}
.champ .who.L{color:var(--red)}
.champ .who.R{color:var(--ink)}
.champ .sub{font-family:var(--f-marker);font-size:clamp(1.2rem,2vw,2rem);margin:0}

/* diploma */
.diploma{position:relative;border:3px solid var(--pencil);outline:2px solid var(--pencil);outline-offset:5px;border-radius:6px 14px 8px 12px;padding:clamp(16px,2vw,30px);display:flex;flex-direction:column;gap:10px;text-align:center}
.diploma h2{font-family:var(--f-marker);color:var(--pencil);font-size:clamp(1.8rem,3.6vw,3.4rem);margin:0;line-height:1;text-wrap:balance}
.diploma .lead{font-size:clamp(1.05rem,1.4vw,1.4rem);margin:0 auto;max-width:30em;text-wrap:pretty}
.stats{display:flex;justify-content:center;flex-wrap:wrap;gap:8px 26px;font-size:clamp(1rem,1.3vw,1.3rem)}
.stats b{font-family:var(--f-marker);font-weight:400;color:var(--red);font-size:1.2em}
.signs{display:flex;justify-content:center;flex-wrap:wrap;gap:6px 22px;margin-top:6px}
.sign{display:flex;flex-direction:column;align-items:center;min-width:90px}
.sign .s{font-family:var(--f-sign);color:var(--ink);font-size:clamp(.9rem,1.25vw,1.25rem);transform:rotate(-4deg);border-bottom:1.5px solid var(--pencil);padding:0 6px 2px;white-space:nowrap}
.sign small{font-size:.75rem;color:#6b7079}
.stamp{position:absolute;right:clamp(6px,2vw,26px);top:clamp(6px,1.4vw,18px);border:4px double var(--red);color:var(--red);font-family:var(--f-marker);font-size:clamp(1.1rem,1.9vw,1.9rem);padding:.45em .7em;border-radius:50%;background:rgba(255,255,255,.6);transform:rotate(-14deg);opacity:.85;animation:stamp .5s .4s cubic-bezier(.3,1.6,.5,1) both}
@keyframes stamp{from{transform:rotate(-14deg) scale(3);opacity:0}}
.photo{font-family:var(--f-marker);color:var(--red);font-size:clamp(1.2rem,2vw,2rem);transform:rotate(-2deg)}

/* efectos */
#burns{position:fixed;inset:0;pointer-events:none;z-index:5;mix-blend-mode:multiply;overflow:hidden}
.burn{position:absolute;background:radial-gradient(closest-side,rgba(60,30,5,.55),rgba(120,65,15,.38) 40%,rgba(190,130,55,.16) 68%,transparent 100%);animation:burnIn .5s ease-out both}
@keyframes burnIn{from{transform:scale(.2);opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:26;overflow:hidden}
.bit{position:absolute;width:16px;height:4px;border-radius:3px;animation:fly 1.3s cubic-bezier(.15,.7,.4,1) forwards}
.bit.dot{width:9px;height:9px;border-radius:50%}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
.plus{position:fixed;z-index:27;font-family:var(--f-marker);font-size:clamp(3rem,7vw,6rem);pointer-events:none;animation:plus 1.2s cubic-bezier(.2,.9,.3,1) forwards}
@keyframes plus{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.2);opacity:1}100%{transform:translateY(-120px) scale(.8);opacity:0}}
#veil{position:fixed;inset:0;pointer-events:none;z-index:24;opacity:0}
#veil.red{animation:veil .6s ease-out;background:radial-gradient(circle,transparent 45%,rgba(201,48,42,.35))}
#veil.yel{animation:veil .6s ease-out;background:radial-gradient(circle,transparent 40%,rgba(255,242,122,.6))}
@keyframes veil{0%{opacity:1}100%{opacity:0}}

/* SVG del dibujo */
.doodle{fill:none;stroke:var(--pencil);stroke-width:3.2;stroke-linecap:round;stroke-linejoin:round}
.ref{fill:none;stroke:none}
.trail{fill:none;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round}
.ember{fill:#ffb020;animation:ember .6s ease-out forwards}
@keyframes ember{to{opacity:0;transform:translateY(-8px)}}
.lbl{font-family:var(--f-hand);font-size:15px;fill:var(--pencil);opacity:0;transition:opacity .5s}
.lbl.on{opacity:1}
.lbl.af{fill:var(--ink)}
.lbl.ef{fill:var(--red)}
.mk{font-family:var(--f-marker);fill:var(--red);opacity:0;transition:opacity .3s}
.mk.on{opacity:1}
.drawing .draw{stroke-dasharray:1 1;stroke-dashoffset:1;animation:draw .8s ease forwards;animation-delay:var(--d,0s)}
@keyframes draw{to{stroke-dashoffset:0}}
.drawing #face{animation:fadeIn .5s 1.9s both}
@keyframes fadeIn{from{opacity:0}}
#legR{transform-box:view-box;transform-origin:150px 292px;transition:transform .7s cubic-bezier(.3,1.6,.5,1)}
#legR.lift{transform:rotate(-34deg)}
#armR{transform-box:view-box;transform-origin:150px 170px;transition:transform .6s}
#armR.wave{animation:wave .7s ease-in-out infinite alternate}
@keyframes wave{from{transform:rotate(-95deg)}to{transform:rotate(-135deg)}}
.farewell{display:flex;flex-direction:column;gap:12px}
.farewell .line{font-size:clamp(1.15rem,1.7vw,1.75rem);line-height:1.35;margin:0;max-width:30em;opacity:0;transform:translateY(8px);transition:opacity .8s,transform .8s;text-wrap:pretty}
.farewell .line.on{opacity:1;transform:none}
.farewell .thanks{font-family:var(--f-marker);font-size:clamp(2.2rem,5vw,4.4rem);color:var(--red);line-height:1;transform:rotate(-2deg)}
.farewell .names{display:flex;flex-wrap:wrap;gap:4px 22px}
.farewell .names span{font-family:var(--f-sign);color:var(--ink);font-size:clamp(1rem,1.6vw,1.6rem);opacity:0;transform:rotate(-4deg) scale(.6);transition:opacity .5s,transform .5s cubic-bezier(.3,1.8,.5,1)}
.farewell .names span.on{opacity:1;transform:rotate(-4deg)}
#figAll.shiver{animation:shiver .11s infinite}
#figAll.jump{animation:jump .5s cubic-bezier(.3,1.8,.5,1)}
@keyframes shiver{0%,100%{translate:0 0}50%{translate:2px 0}}
@keyframes jump{40%{translate:0 -18px}}
#heart{transform-box:fill-box;transform-origin:center}
#heart.slow{animation:beat 1.4s infinite}
@keyframes beat{0%,100%{transform:scale(1)}15%{transform:scale(1.3)}30%{transform:scale(1.05)}45%{transform:scale(1.22)}}
#dog{transform:translateX(-170px);opacity:0;transition:transform 1s cubic-bezier(.2,.9,.3,1.15),opacity .2s}
#dog.in{transform:none;opacity:1}
#tail{transform-box:fill-box;transform-origin:100% 100%}
#tail.wag{animation:wag .25s infinite alternate}
@keyframes wag{from{transform:rotate(-22deg)}to{transform:rotate(18deg)}}
.spark{fill:var(--hl);stroke:var(--pencil);stroke-width:2}

@media (max-width:760px){
  body{background-image:
    linear-gradient(90deg,transparent 8px,var(--margin) 8px,var(--margin) 10px,transparent 10px),
    linear-gradient(var(--grid) 1px,transparent 1px),
    linear-gradient(90deg,var(--grid) 1px,transparent 1px)}
  .inner{padding-left:6px}
  header{grid-template-columns:1fr auto}
  .score{grid-column:1/-1;grid-row:2;justify-content:center;flex-wrap:wrap}
  .stage{grid-template-columns:minmax(0,1fr)}
  .map svg{max-height:280px}
  .note{transform:none}
  .versus{grid-template-columns:1fr}
  .vsbig{justify-self:center}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms!important;transition-duration:.01ms!important}
}

<script>
(function(){
/* ===== Configuración fácil de cambiar ===== */
const LECTORES = ['Franco','Facundo','Valentino','Felipe','Mateo','Todos, ladrando','Facundo'];
const FIRMAS = ['Franco','Facundo','Valentino','Felipe','Mateo'];
const SEG_TURNO = 20, SEG_ROBO = 12;
/* Cierre: cambien estas frases por las suyas si quieren */
const MENSAJE = [
  '<b style="color:var(--red)">Sabías que:</b> todo este juego entró por sus ojos, viajó por sus nervios hasta su cerebro, y su cerebro lo procesó e interpretó. Lo dijimos en la última página.',
  'Pero hay algo que ningún sistema nervioso explica: por qué hoy vinieron, gritaron, se pararon y compitieron como si fuera una final.',
  'Todo lo que vieron hoy lo estudiamos nosotros. Las ganas de aprender nos las enseñaron ustedes.'
];
/* Equipos con nombres sacados de la presentación: las dos partes del sistema autónomo */
const TEAMS = [
  {n:'Los Simpáticos', short:'Simpáticos', s:'L', c:'#c9302a', cry:'¡ATAQUE O HUIDA!'},
  {n:'Los Parasimpáticos', short:'Parasimpáticos', s:'R', c:'#1f3d91', cry:'¡CUERPO EN REPOSO!'}
];

/* Todo el contenido sale de las 7 páginas de "El Sistema Nervioso" */
const STATIONS = [
  {
    place:'Pie derecho', node:[228,425],
    scene:'Te metés a la pileta y el agua está <span class="hl">helada</span>. Ustedes son la señal que sale del pie: hay que avisarle al sistema nervioso central.',
    ask:'¿Por qué vía viajan?',
    opts:[
      {t:'Vía eferente', ok:false, msg:'La eferente va al revés: lleva la señal hacia los órganos efectores.'},
      {t:'Vía aferente', ok:true, msg:'La aferente conduce la señal <b>hacia el sistema central</b> para procesarla. Arrancan por los nervios del sistema periférico.'},
      {t:'Por el autónomo', ok:false, msg:'El autónomo se encarga de las acciones automáticas. No es el camino hacia el centro.'}
    ],
    pre: () => { face('cold'); $('figAll').classList.add('shiver'); on('m-brrr'); sfx('brrr'); },
    run: async () => { await travel(['af1'],'ink'); on('l-nervio'); on('lg-af'); }
  },
  {
    place:'Espalda', node:[150,292],
    scene:'Subieron por los nervios de la pierna y entraron a la columna por la zona lumbar.',
    ask:'¿Dónde están ahora?',
    opts:[
      {t:'En el cerebelo', ok:false, msg:'El cerebelo está en la cabeza, dentro del encéfalo. Adentro de la columna vertebral hay otra cosa.'},
      {t:'En el diencéfalo', ok:false, msg:'El diencéfalo también es parte del encéfalo, que está en la cabeza.'},
      {t:'En la médula espinal', ok:true, msg:'La médula espinal está en el cuello y la espalda, dentro de la columna vertebral.'}
    ],
    run: async () => { await travel(['af2'],'ink'); on('l-medula'); }
  },
  {
    place:'Cuello', node:[150,216],
    scene:'Suben por la médula hasta la cabeza. Para entrar al encéfalo tienen que pasar por la parte que lo conecta con la médula.',
    ask:'¿Por dónde entran?',
    opts:[
      {t:'Por el tronco del encéfalo', ok:true, msg:'El tronco del encéfalo conecta con la médula espinal. Llegan al cerebro, que interpreta la información: <b>¡el agua está helada!</b>'},
      {t:'Por el cráneo', ok:false, msg:'El cráneo es lo que protege al encéfalo. La parte que conecta con la médula espinal es otra.'},
      {t:'Por el cerebelo', ok:false, msg:'El cerebelo es parte del encéfalo, pero el que conecta con la médula espinal es otro.'}
    ],
    run: async () => { await travel(['af3'],'ink'); on('l-tronco'); on('l-cerebro'); on('m-helada'); sfx('ding2'); }
  },
  {
    place:'Cerebro', node:[150,70],
    scene:'El cerebro interpretó la señal: ¡helada! Hay que <span class="hl">sacar el pie del agua YA</span>, y para eso se mueven los músculos esqueléticos de la pierna.',
    ask:'¿Qué sistema se encarga de moverlos?',
    opts:[
      {t:'El autónomo', ok:false, msg:'El autónomo regula funciones involuntarias, como la frecuencia cardíaca o la respiración.'},
      {t:'El somático', ok:true, msg:'El somático mueve los músculos esqueléticos: las partes del cuerpo que movemos voluntariamente.'},
      {t:'El parasimpático', ok:false, msg:'El parasimpático controla el cuerpo cuando está en reposo. Los músculos esqueléticos los mueve otro.'}
    ],
    run: async () => { await travel(['ef1'],'red'); on('lg-ef'); }
  },
  {
    place:'Médula, de vuelta', node:[156,216],
    scene:'Ahora ustedes son la orden: <b>"¡sacá el pie!"</b>. Tienen que bajar desde el centro hasta la pierna.',
    ask:'¿Por qué vía bajan?',
    opts:[
      {t:'Vía aferente', ok:false, msg:'La aferente es la que lleva la señal hacia el centro: la que usaron al principio.'},
      {t:'Vía eferente', ok:true, msg:'La eferente conduce la señal hacia los órganos efectores. Llegan al músculo y… <b>¡pie afuera!</b>'}
    ],
    run: async () => {
      await travel(['ef2','ef3'],'red'); on('l-musculo'); await wait(150);
      $('legR').classList.add('lift'); on('m-afuera'); off('m-brrr'); $('figAll').classList.remove('shiver'); face('happy'); sfx('splash');
    }
  },
  {
    place:'Pecho', node:[122,185], twist:'Pregunta para Los Parasimpáticos… sobre sus rivales.',
    scene:'Pie afuera, todo bien. Y de golpe… <span class="big" style="color:var(--red)">¡GUAU!</span> Un perro enorme viene corriendo hacia la pileta.',
    ask:'¿Qué sistema prepara el cuerpo para el peligro, para atacar o huir?',
    opts:[
      {t:'El parasimpático', ok:false, msg:'El parasimpático controla el cuerpo cuando está en reposo.'},
      {t:'El somático', ok:false, msg:'El somático mueve los músculos que movemos a voluntad. La preparación para el peligro es parte del autónomo.'},
      {t:'El simpático', ok:true, msg:'El simpático prepara el cuerpo para el peligro: baja la actividad del sistema digestivo y aumenta la sangre hacia brazos y piernas.'}
    ],
    pre: () => { $('dog').classList.add('in'); on('m-guau'); face('scared'); $('figAll').classList.add('jump'); sfx('bark'); setTimeout(()=>sfx('bark'),650); },
    run: async (fb) => {
      on('l-sangre1'); on('l-sangre2'); on('l-dig-down');
      fb.insertAdjacentHTML('beforeend','<div class="shout">¡Simpático activado: TODOS DE PIE!</div>');
      sfx('drum',2.4); await wait(2400);
    }
  },
  {
    place:'Pecho', node:[122,185], gold:true, twist:'Pregunta para Los Simpáticos… sobre sus rivales. Y vale DOBLE.',
    scene:'Ya se pueden sentar. Falsa alarma: era Toby, el perro del vecino, y solo quería jugar. Todo se calma.',
    ask:'¿Qué sistema controla el cuerpo ahora que está en reposo?',
    opts:[
      {t:'El parasimpático', ok:true, msg:'El parasimpático controla el cuerpo en reposo: disminuye la frecuencia cardíaca y aumenta la actividad digestiva.'},
      {t:'El simpático', ok:false, msg:'El simpático es para el estrés y el peligro, la reacción de ataque o huida.'},
      {t:'El somático', ok:false, msg:'El somático mueve los músculos esqueléticos. El que controla el cuerpo en reposo es parte del autónomo.'}
    ],
    pre: () => { off('m-guau'); on('m-toby'); $('tail').classList.add('wag'); face('happy'); },
    run: async (fb) => {
      off('l-sangre1'); off('l-sangre2'); off('l-dig-down'); on('l-dig-up');
      on('l-corazon'); setHeart('slow'); face('smile');
      fb.insertAdjacentHTML('beforeend','<div class="breath"><div class="ball"></div><span id="bt">Todos juntos: inspiren…</span></div>');
      sfx('breath'); await wait(3500);
      if($('bt')) $('bt').textContent = '…y suelten el aire.';
      await wait(3600);
      if($('bt')) $('bt').textContent = 'Así se siente el cuerpo en reposo.';
    }
  }
];

const $ = id => document.getElementById(id);
const note = $('note');
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const wait = ms => new Promise(r => setTimeout(r, reduce ? Math.min(ms,60) : ms));
const on = id => $(id) && $(id).classList.add('on');
const off = id => $(id) && $(id).classList.remove('on');
const COLORS = {ink:'#1f3d91', red:'#c9302a'};
const CHECK = '<svg width="1em" height="1em" viewBox="0 0 24 24"><path d="M3 13 C6 15 8 18 9 20 C12 13 16 7 22 3" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>';
const CROSS = '<svg width="1em" height="1em" viewBox="0 0 24 24"><path d="M4 4 C10 10 15 15 20 21 M20 3 C14 9 9 15 4 20" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg>';
const BOLT_SM = '<svg class="bolt" viewBox="0 0 200 300"><path d="M118 8 L40 166 L96 166 L70 292 L162 118 L104 118 L138 8 Z" fill="#fff27a" stroke="#3a3e46" stroke-width="14" stroke-linejoin="round"/></svg>';
const FACES = {
  smile:'M138 112 q12 9 24 0',
  happy:'M136 109 q14 15 28 0 q-14 4 -28 0',
  cold:'M135 114 l5 -3 l5 3 l5 -3 l5 3 l5 -3 l5 3',
  scared:'M144 113 q6 -10 12 0 q-6 10 -12 0'
};

/* ---------- sonido sintetizado ---------- */
let ac = null, soundOn = true;
function audio(){
  if(!soundOn) return null;
  try{ ac = ac || new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume(); }catch(e){ ac=null; }
  return ac;
}
function tone(f, t0, dur, type, vol, f2){
  const a = audio(); if(!a) return;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type||'sine';
  const t = a.currentTime + t0;
  o.frequency.setValueAtTime(f,t);
  if(f2) o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);
  g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.015);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t+dur+0.05);
}
function noise(t0, dur, f1, f2, vol, q){
  const a = audio(); if(!a) return;
  const len = Math.max(1,Math.floor(a.sampleRate*dur)), buf = a.createBuffer(1,len,a.sampleRate), d = buf.getChannelData(0);
  for(let k=0;k<len;k++) d[k]=Math.random()*2-1;
  const s = a.createBufferSource(); s.buffer = buf;
  const bp = a.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=q||1.2;
  const t = a.currentTime + t0;
  bp.frequency.setValueAtTime(f1,t); bp.frequency.exponentialRampToValueAtTime(f2,t+dur);
  const g = a.createGain(); g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  s.connect(bp).connect(g).connect(a.destination); s.start(t);
}
function sfx(name, n){
  if(name==='ding'){ tone(784,0,.18,'triangle',.2); tone(1175,.11,.35,'triangle',.18); }
  if(name==='ding2'){ tone(1046,0,.2,'triangle',.15); tone(1568,.1,.4,'triangle',.12); }
  if(name==='bzzt'){ tone(70,0,.5,'sawtooth',.16); tone(113,0,.5,'square',.07); noise(0,.5,3200,400,.3); noise(.18,.12,5000,2000,.25,3); }
  if(name==='zip'){ noise(0,.55,500,2800,.12); }
  if(name==='splash'){ noise(0,.7,1900,250,.35); noise(.08,.4,900,300,.2); }
  if(name==='bark'){ noise(0,.14,900,500,.5,2); tone(420,0,.14,'sawtooth',.12,240); noise(.2,.12,950,520,.45,2); tone(430,.2,.12,'sawtooth',.1,250); }
  if(name==='drum'){ const d=n||1.1; for(let t=0;t<d;t+=.055) tone(110+Math.random()*20,t,.05,'triangle',.06+.1*t/d); }
  if(name==='brrr'){ for(let k=0;k<10;k++) noise(k*.06,.05,2400,1800,.07,4); }
  if(name==='breath'){ noise(0,3.4,300,1200,.08,.7); noise(3.5,3.5,1200,300,.08,.7); }
  if(name==='pencil'){ for(let k=0;k<14;k++) noise(k*.13+Math.random()*.05,.09,3800,2600,.05,2.5); }
  if(name==='steal'){ [392,523,659].forEach((f,k)=>tone(f,k*.08,.18,'square',.07)); }
  if(name==='tick'){ tone(1400,0,.03,'square',.05); }
  if(name==='tock'){ tone(900,0,.05,'square',.07); }
  if(name==='whoosh'){ noise(0,.35,400,3000,.15); }
  if(name==='horn'){ tone(220,0,.5,'sawtooth',.12); tone(277,0,.5,'sawtooth',.09); tone(330,0,.5,'sawtooth',.08); }
  if(name==='win'){ [523,659,784,1046,1318].forEach((f,k)=>tone(f,k*.12,.45,'triangle',.15)); noise(.5,1.2,2000,6000,.08); }
  if(name==='stamp'){ tone(90,0,.18,'sine',.6,40); noise(0,.12,800,200,.4); }
  if(name==='gold'){ [784,988,1175,1568].forEach((f,k)=>tone(f,k*.07,.5,'triangle',.12)); }
}

function confetti(color, x, y, n){

    b.style.background = Math.random()<.25 ? '#fff27a' : (color || '#3a3e46');
    b.style.setProperty('--dx', Math.cos(ang)*dist+'px');

}
function plusAt(text, color, el){

function shake(){ ['note','map'].forEach(id => { const el=$(id); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }); }
function burn(){
  const b = document.createElement('div'); b.className = 'burn';
  const R = note.getBoundingClientRect(), sz = 100 + Math.random()*90;
  const corners = [[R.left,R.top],[R.right,R.top],[R.left,R.bottom],[R.right,R.bottom],[R.right,(R.top+R.bottom)/2],[R.left,(R.top+R.bottom)/2]];
  const [cx,cy] = corners[(state.shorts-1) % corners.length];
  const left = Math.min(innerWidth - sz, cx - sz/2 + (Math.random()-.5)*40);
  const top = Math.min(innerHeight - sz, cy - sz/2 + (Math.random()-.5)*40);

  $('burns').appendChild(b);
}

/* Cuadro siguiente: requestAnimationFrame, con respaldo por si la ventana está tapada y el navegador lo frena */
function nextFrame(cb){
  let done = false;
  const go = () => { if(done) return; done = true; cb(performance.now()); };
  requestAnimationFrame(go); setTimeout(go, 60);
}

/* ---------- chispa ---------- */
function seg(id, color){
  return new Promise(res=>{
    const ref = $(id), g = ref.parentNode, L = ref.getTotalLength();
    const p = ref.cloneNode(); p.removeAttribute('id'); p.setAttribute('class','trail');
    p.style.stroke = COLORS[color]; p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    g.appendChild(p);
    const NS='http://www.w3.org/2000/svg';
    const sp = document.createElementNS(NS,'circle');
    sp.setAttribute('r','7'); sp.setAttribute('class','spark'); sp.setAttribute('filter','url(#glow)');
    g.appendChild(sp);
    const dur = reduce ? 1 : Math.max(420, L*5.5);
    const t0 = performance.now(); let fr = 0;
    (function step(now){
      const k = Math.min(1,(now-t0)/dur), e = k<.5 ? 2*k*k : 1-Math.pow(-2*k+2,2)/2;
      const pt = ref.getPointAtLength(L*e);
      sp.setAttribute('cx',pt.x); sp.setAttribute('cy',pt.y);
      p.style.strokeDashoffset = L*(1-e);
      if(!reduce && (fr++ % 2 === 0)){
        const em = document.createElementNS(NS,'circle');
        em.setAttribute('cx', pt.x + (Math.random()-.5)*8); em.setAttribute('cy', pt.y + (Math.random()-.5)*8);
        em.setAttribute('r', 1.5 + Math.random()*2); em.setAttribute('class','ember');
        g.appendChild(em); setTimeout(()=>em.remove(), 650);
      }
      if(k<1) nextFrame(step); else { sp.remove(); res(); }
    })(t0);
  });
}
async function travel(ids, color){ sfx('zip'); for(const id of ids) await seg(id,color); }
function bzztAt([x,y]){
  const m = $('m-bzzt');
  m.setAttribute('x', Math.min(x+12, 236)); m.setAttribute('y', Math.max(y-10, 40));
  m.classList.add('on'); setTimeout(()=>m.classList.remove('on'), 1100);
}

/* ---------- tanteador ---------- */
function tally(n){
  if(!n) return '<svg class="tally" viewBox="0 0 20 26"><line x1="4" y1="14" x2="16" y2="13"/></svg>';
  const groups = Math.ceil(n/5); let s = '<svg class="tally" viewBox="0 0 '+(groups*36)+' 26">';
  for(let k=0;k<n;k++){
    const g = Math.floor(k/5), j = k%5, x0 = g*36+5, jit = ((k*37)%5-2)*.5;
    if(j<4) s += '<line x1="'+(x0+j*7+jit)+'" y1="3" x2="'+(x0+j*7-jit)+'" y2="23"/>';
    else s += '<line x1="'+(x0-4)+'" y1="19" x2="'+(x0+26)+'" y2="7"/>';
  }
  return s + '</svg>';
}
function drawScore(bumpIdx){
  const sc = $('score'), live = phase==='answer' || phase==='read' || phase==='suspense';
  sc.innerHTML =
    '<div class="team L'+(live&&state.turn===0?' turn':'')+'" id="t0"><span class="nm">← Simpáticos</span>'+tally(state.score[0])+'<span class="num">'+state.score[0]+'</span></div>' +

function relate(extra){
  const [a,b] = state.score, d = Math.abs(a-b), lead = a>b?0:1, L = TEAMS[lead].n;

  if(d===0) s = '¡Empate '+a+' a '+b+'! Esto está que arde.';

/* ---------- mecha (cuenta regresiva) ---------- */
let fuse = null;
function fuseHTML(){ return '<div class="fuse" id="fuse" aria-label="Tiempo restante"><div class="track"><div class="rope" id="rope"></div><div class="fire" id="fire"></div></div><span class="sec" id="sec"></span></div>'; }
function startFuse(sec){
  stopFuse();
  fuse = {total:sec*1000, left:sec*1000, last:performance.now(), running:true, lastSec:null};
  const el = $('fuse'); if(el) el.classList.remove('low','paused');
  (function tick(now){
    if(!fuse) return;
    if(fuse.running){ fuse.left -= now - fuse.last; }
    fuse.last = now;
    const f = Math.max(0, fuse.left/fuse.total), s = Math.ceil(Math.max(0,fuse.left)/1000);
    const rope = $('rope'), fire = $('fire'), sc = $('sec'), box = $('fuse');
    if(rope){ rope.style.transform = 'scaleX('+f+')'; fire.style.left = (f*100)+'%'; sc.textContent = s; }
    if(box){ box.classList.toggle('low', s<=5); box.classList.toggle('paused', !fuse.running); }
    if(fuse.running && s!==fuse.lastSec){ fuse.lastSec = s; if(s<=5 && s>0) sfx('tock'); else if(s>5) sfx('tick'); }
    if(fuse.left<=0){ fuse = null; timeout(); return; }
    nextFrame(tick);
  })(performance.now());
}
function pauseFuse(p){ if(fuse){ fuse.running = !p; fuse.last = performance.now(); } }
function stopFuse(){ fuse = null; }

async function choose(k){
  const s = STATIONS[state.i]; if(!s || phase!=='answer') return;
  const btn = note.querySelector('.opt[data-k="'+k+'"]'); if(!btn || btn.disabled) return;
  phase = 'suspense'; pauseFuse(true);
  btn.classList.add('pending');
  note.querySelectorAll('.opt').forEach(b => b.disabled = true);
  sfx('drum',1.1);
  await wait(1150);
  btn.classList.remove('pending');
  const o = s.opts[k], fb = $('fb');
  if(o.ok){
    stopFuse(); phase = 'done'; edge();
    btn.classList.add('right');
    const pts = s.gold ? 2 : 1, team = state.turn, stolen = state.stealing;
    fb.className = 'fb good';
    fb.innerHTML = '<span class="tag">'+CHECK+(stolen?'¡ROBO!':'¡Señal en camino!')+'</span><span>'+o.msg+'</span>';
    sfx(stolen ? 'steal' : 'ding');
    award(team, pts);
    drawScore(team);
    const rel = $('rel'); rel.hidden = false;
    rel.textContent = relate(stolen ? '¡'+TEAMS[team].n+' se quedan con el punto ajeno!' : '');
    await s.run(fb);
    finishStation();
  } else {
    state.shorts++;
    btn.classList.add('wrong');
    fb.className = 'fb bad';
    sfx('bzzt'); bzztAt(s.node); burn(); veil('red'); shake();
    if(!state.stealing){
      fb.innerHTML = '<span class="tag">'+CROSS+'¡Cortocircuito!</span><span>'+o.msg+'</span>';
      switchTurn();
      note.querySelectorAll('.opt').forEach(b => { if(!b.classList.contains('wrong')) b.disabled = false; });
      phase = 'answer';
      startFuse(SEG_ROBO);
    } else {
      stopFuse();
      fb.innerHTML = '<span class="tag">'+CROSS+'¡Doble cortocircuito!</span><span>'+o.msg+'</span>';
      await nobody(fb);
    }
  }
}
async function timeout(){
  const s = STATIONS[state.i]; if(!s || phase!=='answer') return;

  state.shorts++;

  } else {

/* ---------- duelo final de capitanas ---------- */
const DECOYS = [
  {art:'<svg viewBox="0 0 220 160"><path d="M20 60 C60 150 170 150 205 40 C180 95 70 110 20 60 Z" fill="#fff27a" stroke="#3a3e46" stroke-width="6" stroke-linejoin="round"/><path d="M205 40 l8 -14" stroke="#3a3e46" stroke-width="6" stroke-linecap="round"/></svg>', cap:'Es una banana.'},
  {art:'<div class="word">RAYO</div>', cap:'Es la palabra, no el rayo.'},
  {art:'<svg viewBox="0 0 200 120"><path d="M20 60 C 60 10, 140 10, 180 60 C 140 110, 60 110, 20 60 Z" fill="#fff" stroke="#3a3e46" stroke-width="6"/><circle cx="100" cy="60" r="24" fill="#1f3d91"/><circle cx="100" cy="60" r="10" fill="#3a3e46"/></svg>', cap:'Es un ojo mirándolos.'}
];
const BOLT = '<svg viewBox="0 0 200 300"><path d="M118 8 L40 166 L96 166 L70 292 L162 118 L104 118 L138 8 Z" fill="#fff" stroke="#3a3e46" stroke-width="7" stroke-linejoin="round"/></svg>';

function duelIntro(){
  phase = 'duel-intro'; edge(); drawScore();
  const [a,b] = state.score, d = Math.abs(a-b);
  const stakes = d===0 ? 'Están empatados. El duelo define todo.'
    : d<=2 ? TEAMS[a>b?1:0].n+' pueden empatar o dar vuelta el partido acá.'
    : TEAMS[a>b?0:1].n+' van ganando, pero el duelo vale 2. Que no se relajen.';
  setNote(
    '<div class="eyebrow"><span>Duelo final de capitanas · vale 2</span>'+dots(STATIONS.length)+'</div>' +
    '<p class="ask">Las dos Neuronas Capitanas, al frente.</p>' +
    '<p class="relator">'+stakes+'</p>' +
    '<p class="scene">Cuando aparezca <span class="hl">el rayo</span>, la primera en apretar su tecla gana. Si aprietan con una trampa o antes de tiempo: <b style="color:var(--red)">pierden</b>.</p>' +
    '<div class="keys"><div class="key L"><kbd>A</kbd><span>Capitana Simpática</span><small>o tocá la mitad izquierda</small></div><div class="key R"><kbd>L</kbd><span>Capitana Parasimpática</span><small>o tocá la mitad derecha</small></div></div>' +
    '<div class="row"><button class="go" id="ready" type="button">Que empiece el duelo →</button><span class="hint">La sala puede gritar, pero no tocar.</span></div>');
  $('ready').onclick = duelRun; afterKey = duelRun;
  $('ready').focus({preventScroll:true});
}

async function duelRun(){
  afterKey = null; phase = 'duel';
  $('ready').blur();
  setNote('<p class="wait">Atentos…</p><p class="scene">Dedos sobre la A y la L. No vale adelantarse.</p>');
  duel = {stage:'wait', t0:0, id: Math.random()};
  const myId = duel.id;
  const fl = $('flash');
  const pool = DECOYS.slice().sort(()=>Math.random()-.5).slice(0, 1 + Math.floor(Math.random()*2));
  await new Promise(r => setTimeout(r, 1600 + Math.random()*1400));
  for(const d of pool){
    if(!duel || duel.id!==myId) return;
    duel.stage = 'decoy';
    fl.className = 'flash'; fl.innerHTML = d.art + '<p>'+d.cap+' ¡No toquen!</p>'; fl.hidden = false;
    sfx('tick');
    await new Promise(r => setTimeout(r, 1300));
    if(!duel || duel.id!==myId) return;
    fl.hidden = true; duel.stage = 'wait';
    await new Promise(r => setTimeout(r, 1100 + Math.random()*1800));
  }
  if(!duel || duel.id!==myId) return;
  duel.stage = 'go'; duel.t0 = performance.now();
  fl.className = 'flash real'; fl.innerHTML = BOLT + '<div class="halves"><span style="color:var(--red)">← A</span><span style="color:var(--ink)">L →</span></div>'; fl.hidden = false;
  setTimeout(()=>{ if(duel && duel.id===myId && duel.stage==='go'){ fl.hidden = true; setNote('<p class="clock" id="clock">¡YA!</p>'); } }, 900);
  setTimeout(()=>{ if(duel && duel.id===myId && duel.stage==='go'){ duelEnd(null, 'Nadie apretó'); } }, 5000);
}

function duelPress(team){
  if(!duel || phase!=='duel') return;
  if(duel.stage==='go'){
    const t = (performance.now() - duel.t0)/1000;
    duelEnd(team, null, t);
  } else {
    duelEnd(1-team, 'false', null, team);
  }
}

async function duelEnd(winner, why, t, culprit){
  const fl = $('flash'); fl.hidden = true;
  const st = duel ? duel.stage : null;
  duel = null; phase = 'duel-done';
  if(winner===null){
    setNote('<p class="ask">Nadie apretó a tiempo.</p><div class="row"><button class="go" id="again" type="button">Repetir el duelo →</button></div>');
    $('again').onclick = duelRun; afterKey = duelRun; return;
  }
  state.duelWinner = winner;
  const W = TEAMS[winner];
  let head, body;
  if(why==='false'){
    sfx('bzzt'); veil('red'); shake(); state.shorts++; burn();
    head = '¡Cortocircuito de '+TEAMS[culprit].n+'!';
    body = 'Apretaron '+(st==='decoy'?'con una trampa':'antes de tiempo')+'. El duelo es para '+W.n+'.';
  } else {
    state.react = t;
    head = '¡'+W.n+' en '+t.toFixed(2).replace('.',',')+' segundos!';
    body = 'En ese tiempo la señal hizo todo este viaje:';
  }
  setNote(
    '<div class="eyebrow"><span>Resultado del duelo</span></div>' +
    '<p class="shout" style="color:'+W.c+'">'+head+'</p>' +
    '<p class="scene">'+body+'</p>' +
    (why==='false' ? '' :
    '<ul class="chain" id="chain">' +
      '<li>los ojos ven el rayo</li><li class="ar">→</li>' +
      '<li class="af">nervios, vía aferente</li><li class="ar">→</li>' +
      '<li class="af">el cerebro interpreta</li><li class="ar">→</li>' +
      '<li class="ef">vía eferente</li><li class="ar">→</li>' +
      '<li class="ef">el somático mueve el dedo</li>' +
    '</ul>') +
    '<p class="relator" id="rel" hidden></p>' +
    '<div class="row" id="endrow" hidden><span></span><button class="go" id="end" type="button">¿Quién ganó? →</button></div>');
  award(winner, 2); sfx('steal');
  if($('chain')) for(const li of [...$('chain').children]){ li.classList.add('on'); if(!li.classList.contains('ar')) tone(660,0,.08,'triangle',.08); await wait(380); }
  const rel = $('rel'); rel.hidden = false; rel.textContent = relate('');
  $('endrow').hidden = false;
  $('end').onclick = champions; afterKey = champions;
  $('end').focus({preventScroll:true});
}

async function champions(){
  afterKey = null; phase = 'end'; edge(); drawScore();
  sfx('drum',1.6);
  setNote('<p class="wait" style="color:var(--pencil)">Y los campeones del sistema nervioso son…</p>');
  await wait(1800);
  const [a,b] = state.score;
  const tie = a===b, w = a>b?0:1;
  setNote(
    '<div class="champ">' +
      '<svg class="crown" viewBox="0 0 120 80"><path d="M10 70 L14 22 L38 46 L60 10 L82 46 L106 22 L110 70 Z" fill="#fff27a" stroke="#3a3e46" stroke-width="5" stroke-linejoin="round"/><circle cx="60" cy="10" r="6" fill="#c9302a"/></svg>' +
      (tie ? '<p class="who L" style="color:var(--pencil)">¡EMPATE!</p><p class="sub">El autónomo necesita a los dos: simpático y parasimpático.</p>'
           : '<p class="sub">Campeones del sistema nervioso</p><p class="who '+TEAMS[w].s+'">'+TEAMS[w].n.toUpperCase()+'</p>') +
      '<p class="sub">'+a+' a '+b+'</p>' +
      '<div class="row" style="justify-content:center"><button class="go" id="dip" type="button">Ver el diploma →</button></div>' +
    '</div>');
  sfx('win');
  const r = note.getBoundingClientRect();
  const col = tie ? '#3a3e46' : TEAMS[w].c;
  confetti(col, r.left + r.width*.3, r.top + r.height*.4, 40);
  setTimeout(()=>confetti(col, r.left + r.width*.7, r.top + r.height*.4, 40), 350);
  setTimeout(()=>confetti('#fff27a', r.left + r.width*.5, r.top + r.height*.2, 40), 700);
  $('dip').onclick = diploma; afterKey = diploma;
  $('dip').focus({preventScroll:true});
}

function diploma(){
  afterKey = null;
  sfx('stamp');
  const [a,b] = state.score;
  const winner = a===b ? 'Empate '+a+' a '+b : TEAMS[a>b?0:1].n+', '+Math.max(a,b)+' a '+Math.min(a,b);
  const t = state.react!=null ? state.react.toFixed(2).replace('.',',')+' s' : '—';
  const hoy = new Date().toLocaleDateString('es-AR',{day:'numeric',month:'long',year:'numeric'});
  setNote(
    '<div class="diploma">' +
      '<span class="stamp">APROBADO</span>' +
      '<h2>Diploma de Impulso Nervioso</h2>' +
      '<p class="lead">Se certifica que <b>las familias de esta sala</b> viajaron del pie al cerebro y de vuelta, por la vía aferente y la eferente, y sobrevivieron a un perro.</p>' +
      '<div class="stats">' +
        '<span>Ganó: <b>'+winner+'</b></span>' +
        '<span>Tiempo de reacción: <b>'+t+'</b></span>' +
        '<span>Quemaduras en la hoja: <b>'+state.shorts+'</b></span>' +
      '</div>' +
      '<div class="signs">' + FIRMAS.map(f=>'<div class="sign"><span class="s">'+f+'</span></div>').join('') + '</div>' +
      '<small style="color:#6b7079">'+hoy+'</small>' +
    '</div>' +
    '<div class="row"><span class="photo">¡Sáquenle una foto al diploma!</span><button class="go" id="last" type="button">Una última señal →</button></div>');
  setHeart('slow'); face('happy');
  $('last').onclick = farewell; afterKey = farewell;
  $('last').focus({preventScroll:true});
}

async function farewell(){
  afterKey = null; phase = 'end'; edge();
  setNote(
    '<div class="farewell">' +
      '<div class="eyebrow"><span>Una última señal</span></div>' +
      MENSAJE.map((m,k)=>'<p class="line" id="ln'+k+'">'+m+'</p>').join('') +
      '<p class="line thanks" id="lnT">¡Gracias por jugar!</p>' +
      '<div class="names">' + FIRMAS.map((f,k)=>'<span id="nm'+k+'">'+f+'</span>').join('') + '</div>' +
      '<div class="row" id="byerow" hidden><span></span><button class="go" id="again" type="button" style="font-size:1rem">Jugar otra vez</button></div>' +
    '</div>');
  face('happy'); setHeart('slow');
  for(let k=0;k<MENSAJE.length;k++){ await wait(k===0?400:2600); const l=$('ln'+k); if(!l) return; l.classList.add('on'); tone(523+k*130,0,.5,'triangle',.06); }
  await wait(2600); if(!$('lnT')) return;
  $('lnT').classList.add('on'); $('armR').classList.add('wave'); sfx('win');
  const r = note.getBoundingClientRect();
  confetti('#c9302a', r.left + r.width*.3, r.top + r.height*.6, 30);
  confetti('#1f3d91', r.left + r.width*.7, r.top + r.height*.6, 30);
  for(let k=0;k<FIRMAS.length;k++){ await wait(450); const n=$('nm'+k); if(!n) return; n.classList.add('on'); sfx('tick'); }
  $('byerow').hidden = false;
  $('again').onclick = intro;
}

function resetMap(){
  document.querySelectorAll('.trail').forEach(e=>e.remove());
  document.querySelectorAll('.lbl.on, .mk.on').forEach(e=>{ if(!e.closest('#lg-af,#lg-ef') || e.id) e.classList.remove('on'); });
  $('legR').classList.remove('lift');
  $('figAll').classList.remove('shiver','jump');
  $('armR').classList.remove('wave');
  $('dog').classList.remove('in'); $('tail').classList.remove('wag');
  setHeart(null); face('smile');
}

/* ---------- controles ---------- */
$('snd').onclick = () => { soundOn = !soundOn; $('snd').textContent = 'sonido: ' + (soundOn?'sí':'no'); };
$('fs').onclick = () => {
  try{
    if(document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen().catch(()=>{});
  }catch(e){}
};
document.addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if(phase==='duel'){ if(k==='a'){ duelPress(0); e.preventDefault(); } else if(k==='l'){ duelPress(1); e.preventDefault(); } return; }
  if(k==='p' && fuse){ pauseFuse(fuse.running); e.preventDefault(); return; }
  if(['1','2','3'].includes(k) && phase==='answer'){ choose(+k-1); e.preventDefault(); return; }
  if((e.key==='Enter'||e.key==='ArrowRight') && afterKey){
    if(document.activeElement && document.activeElement.tagName==='BUTTON' && e.key==='Enter') return;
    const f = afterKey; afterKey = null; f(); e.preventDefault();
  }
});
document.addEventListener('pointerdown', e => {
  if(phase!=='duel') return;
  duelPress(e.clientX < innerWidth/2 ? 0 : 1);
});

intro();
})();
</script>
</body>
</html>
